proxy:
  request_timeout: 30   # seconds per upstream request
  max_retries: 12       # attempts before failing (across all providers)

fallback:
  enabled: false
  base_url: "http://localhost:11434"  # Ollama URL (/v1 auto-appended)
  model: "llama3.2:3b"
  timeout: 30

accounts:
  # OpenAI
  - name: openai-main
    type: openai
    api_key: sk-YOUR_OPENAI_API_KEY
    models:
      chat:
        - gpt-4o
        - gpt-4o-mini
    default_models:
      chat: gpt-4o-mini
    limits:
      - metric: rpm
        max_value: 500
      - metric: tpm
        max_value: 300000
    enabled: true

  # Groq — fast inference
  - name: groq-free
    type: groq
    api_key: gsk_YOUR_GROQ_API_KEY
    models:
      chat:
        - llama-3.3-70b-versatile
        - llama-3.1-8b-instant
    default_models:
      chat: llama-3.3-70b-versatile
    limits:
      - metric: rpm
        max_value: 30
      - metric: tpm
        max_value: 6000
    enabled: true

  # Google Gemini
  - name: google-main
    type: google
    api_key: AIzaSy_YOUR_GOOGLE_API_KEY
    models:
      chat:
        - models/gemini-2.5-flash
        - models/gemini-2.0-flash
    default_models:
      chat: models/gemini-2.5-flash
    limits:
      - metric: rpm
        max_value: 60
      - metric: tpd
        max_value: 1000000
    enabled: true

  # OpenRouter — access many models
  - name: openrouter-free
    type: openrouter
    api_key: sk-or-YOUR_OPENROUTER_KEY
    models:
      chat:
        - openai/gpt-4o-mini:free
        - meta-llama/llama-3.3-70b-instruct:free
    default_models:
      chat: openai/gpt-4o-mini:free
    limits:
      - metric: rpm
        max_value: 20
    enabled: true

  # Cerebras — ultra-fast inference
  - name: cerebras-free
    type: cerebras
    api_key: YOUR_CEREBRAS_KEY
    models:
      chat:
        - llama3.1-8b
    default_models:
      chat: llama3.1-8b
    limits:
      - metric: rpm
        max_value: 30
    enabled: true

  # Mistral
  - name: mistral-free
    type: mistral
    api_key: YOUR_MISTRAL_KEY
    models:
      chat:
        - mistral-small-latest
        - mistral-medium-latest
    default_models:
      chat: mistral-small-latest
    limits:
      - metric: tpm
        max_value: 50000
      - metric: tpmo
        max_value: 4000000
    enabled: true

  # GitHub Models
  - name: github-models
    type: github
    api_key: ghp_YOUR_GITHUB_PAT
    models:
      chat:
        - gpt-4o
        - Meta-Llama-3.1-8B-Instruct
    default_models:
      chat: gpt-4o
    limits:
      - metric: rpd
        max_value: 150
    enabled: true

  # Cohere — chat + embeddings
  - name: cohere-main
    type: cohere
    api_key: YOUR_COHERE_KEY
    models:
      chat:
        - command-a-03-2025
        - command-r-08-2024
      embedding:
        - embed-v4.0
    default_models:
      chat: command-a-03-2025
      embedding: embed-v4.0
    limits:
      - metric: rpm
        max_value: 20
    enabled: true

  # NVIDIA NIM
  - name: nvidia-nim
    type: nvidia
    api_key: nvapi-YOUR_NVIDIA_KEY
    models:
      chat:
        - meta/llama3-70b-instruct
    default_models:
      chat: meta/llama3-70b-instruct
    enabled: true

  # Ollama — local models
  - name: ollama-local
    type: ollama
    base_url: http://localhost:11434/v1
    api_key: ollama
    models:
      chat:
        - llama3.2
        - qwen2.5-coder:7b
    default_models:
      chat: llama3.2
    limits: []
    enabled: false
