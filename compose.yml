services:
  llm-proxy:
    image: darkraise/llm-proxy:latest
    container_name: llm-proxy
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - ./data:/data
    environment:
      # Use .env file or escape $$ in YAML: $$2a$$12$$...
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/llm-proxy", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
